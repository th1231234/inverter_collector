// ==================================================================
// 逆变器采集遥测协议（阶段三）
// ------------------------------------------------------------------
// 生成 C 代码：
//   protoc --plugin=protoc-gen-c=<protoc-gen-c.exe 路径> \
//          --proto_path=proto --c_out=main proto/telemetry.proto
//
// 字段号规划原则（P-07）：
//   - 1~15 号的 tag 只占 1 字节，留给最常用字段
//   - req_id 永远是第 1 位：它是请求/应答的关联键，每条都要带
//   - 发布后字段号不可修改、不可复用（会破坏线上兼容）
//
// 四个 message 放在同一文件：protobuf-c 没有命名空间，
// 拆成多个 .proto 反而容易出现同名 message 导致链接冲突。
// ==================================================================

syntax = "proto3";

// ------------------------------------------------------------------
// 下行：dev/<工号>/read —— 上位机查询寄存器（功能码 03）
// ------------------------------------------------------------------
message ReadRequest {
  string req_id = 1;   // 请求编号，应答原样带回
  uint32 slave  = 2;   // 从机地址 1~247
  uint32 addr   = 3;   // 起始寄存器地址
  uint32 num    = 4;   // 读取数量 1~16
}

// ------------------------------------------------------------------
// 下行：dev/<工号>/write —— 上位机修改寄存器（功能码 06）
// ------------------------------------------------------------------
message WriteRequest {
  string req_id = 1;   // 请求编号
  uint32 slave  = 2;   // 从机地址
  uint32 addr   = 3;   // 目标寄存器地址
  uint32 value  = 4;   // 写入的原始值
}

// ------------------------------------------------------------------
// 上行：dev/<工号>/resp —— 设备应答，每个请求必回一条
// ------------------------------------------------------------------
message Resp {
  string req_id         = 1;  // 对应请求的编号
  bool   ok             = 2;  // true=成功，false=失败
  string msg            = 3;  // 失败原因；成功时为空串
  repeated uint32 values = 4; // 查询结果；仅 read 成功时携带
}

// ------------------------------------------------------------------
// 上行：dev/<工号>/data —— 单个测点
// 同时携带原始值与物理值，避免上位机重复实现换算规则
// ------------------------------------------------------------------
message Metric {
  uint32 addr  = 1;  // 寄存器地址，如 0x3000
  uint32 raw   = 2;  // 原始寄存器值，如 3500
  float  value = 3;  // 换算后物理值，如 350.0
  // 4 号字段为多从机扩展新增（阶段三之后）。
  // 一台设备下挂多个 Modbus 从机时，仅凭 addr 无法区分测点归属：
  // 站号 1 的 0x3000 和站号 2 的 0x3000 是两个不同的量。
  // 因此每个 Metric 自带站号，Telemetry 结构不变，兼容已有上位机
  // （旧解析器会把这个未知字段当"不认识就跳过"，不会报错）。
  //
  // 注意：站号从 1 开始（Modbus 规定 1~247），永远不会是 0；
  // 而 proto3 里等于默认值 0 的字段不会写进字节流。正好不会出现
  // "字段被省略导致上位机读成 0 号从机"的情况。
  uint32 slave = 4;  // 从机站号 1~247，如 2
}

// ------------------------------------------------------------------
// 上行：dev/<工号>/data —— 周期遥测帧
// ------------------------------------------------------------------
message Telemetry {
  string          device_id = 1;  // 工号，与 Client ID 一致
  uint32          seq       = 2;  // 帧序号，每发一条 +1，重启归零
  int64           ts_ms     = 3;  // 采集时刻，Unix 毫秒（SNTP 对时后）
  int32           state     = 4;  // 0=正常 1=故障（读失败时数值为上次缓存）
  // metrics 是"所有从机所有测点"拍平后的平铺列表，靠每项的 slave 字段区分归属。
  // 一台设备挂 3 个从机 × 3 个测点 = 9 项，一帧一次发完，
  // 上位机拿到的永远是同一时刻的整机快照，不会出现"先收到站号 1、
  // 三秒后才收到站号 2"这种时间错位。
  repeated Metric metrics   = 5;  // 测点列表（可跨多个从机）
}
